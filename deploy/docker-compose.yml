name: homeledger

# 两种启动方式：
#   docker compose up -d                          → 仅 mysql + redis（日常开发，后端跑在宿主机 8080）
#   docker compose --profile full up -d --build   → 四个服务全启（验证容器化部署链路，需求 §6.3）
#
# 所有口令与端口来自同目录 .env（由 .env.example 复制），不入库。

# json-file 不限会无限增长（nginx access log 走 stdout），统一 10m×3
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    container_name: homeledger-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      # 绑 127.0.0.1：MySQL/Redis 只供宿主机开发访问，不暴露局域网/公网（扫描报告 P0-2；
      # 之前无前缀 = 0.0.0.0 对外，弱口令直接裸奔）。对外只有 nginx 一个入口。
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:8-alpine
    container_name: homeledger-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  app:
    profiles: ["full"]
    build:
      context: ../backend
    image: homeledger-backend:local
    container_name: homeledger-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 说明：unhealthy 只让状态可见于 docker ps / 监控，普通 docker compose **不会**因此重启容器
      # （restart 只管容器退出；JVM 假死要自动拉起需另配 autoheal 看门狗）。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS}
      # §4.3.1 档案照片：与 nginx 共享同一卷，读取走 X-Accel-Redirect 由 nginx internal 直出
      HOMELEDGER_UPLOAD_DIR: /data/uploads
      HOMELEDGER_UPLOAD_USE_NGINX_ACCEL: "true"
      TZ: Asia/Shanghai
    ports:
      # 绑 127.0.0.1：后端必须经 nginx 进入（限流的 X-Real-IP 信任契约见 ClientIpResolver）。
      # 直连暴露后端端口会绕过 nginx 的头覆盖语义，等于把限流键交给客户端伪造。
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - uploads-data:/data/uploads

  nginx:
    profiles: ["full"]
    image: nginx:1.29-alpine
    container_name: homeledger-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads-data:/data/uploads:ro

volumes:
  mysql-data:
  redis-data:
  uploads-data:
