# 家记 - 宿主机 Nginx 站点配置片断
#
# 前置：你的 nginx 是宿主机安装的 → 存为 /etc/nginx/conf.d/homeledger.conf，然后
#       nginx -t && nginx -s reload
# 若你的 nginx 跑在 docker 里：把本文件挂载进容器相同路径并 reload；此时
#       1) proxy_pass 的 127.0.0.1:8080 改成后端容器的地址（同网络用容器名 homeledger-app:8080）；
#       2) /photos/ 的 alias 路径要指向容器内能看到 /opt/homeledger/uploads 的挂载点。
#
# 端口用 18088（与客户端默认 API 基址一致，也避开 80 上已有的站点）。
# 安全组/防火墙需放行 TCP 18088。
# HTTPS 待办：接证书后本段改为 80/443，客户端基址换 https（后端正则已支持 X-Forwarded-Proto）。

server {
    listen 18088;
    server_name _;
    # 对外暴露的版本号没有用处（dev 的 nginx.conf 早已关掉，这里补齐同一口径）
    server_tokens off;

    # API 的 JSON 响应走 gzip；照片本身已压缩不进 gzip_types（与 dev nginx.conf 同一份口径）
    gzip              on;
    gzip_types        application/json text/css application/javascript;
    gzip_min_length   1024;
    gzip_comp_level   5;

    # 必须 ≥ 后端 multipart 上限（10MB），否则传照片报 413
    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 档案照片直出：后端鉴权通过后回 X-Accel-Redirect: /photos/...，本 internal 位置
    # 从共享目录取文件替换响应体。internal = 外部直接 GET /photos/... 一律 404。
    # alias 目录即 compose 里 app 挂载 /data/uploads 的宿主路径，必须带尾斜杠。
    # 缓存头由后端随响应发出（X-Accel 透传），nginx 不再重复 add_header（复扫 2026-10-26 P2）。
    location /photos/ {
        internal;
        alias /opt/homeledger/uploads/;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}