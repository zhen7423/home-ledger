# 家记 - 生产服务器专用编排
#
# 为什么不是仓库根目录那份 docker-compose.yml：
#   1. 服务器已有 nginx / redis 在跑，Nginx 与 Redis 复用现有的，不在这份里再起；
#   2. 项目后端是 Spring Boot 4.1.1 + Java 25 编译，宿主机只有 JDK 1.8 → 后端必须容器化；
#   3. 数据库迁移（V1__schema.sql）用 utf8mb4_0900_ai_ci，是 MySQL 8+ 专属，
#      服务器现有的 MySQL 5.7 容器跑不了 → 另起一个 MySQL 8.4 容器，端口避开 3306。
#
# 用法（完整步骤见 docs/部署指南.md）：
#   cp .env.prod.example .env.prod   # 填口令
#   docker compose --env-file .env.prod up -d
#
# 首次启动 Flyway 自动建库迁表（V1__schema.sql + Java 种子迁移，含疫苗/生长标准字典）。

# 固定 compose 项目名：不写的话项目名随执行目录推导，换目录 up 会创建一套全新空卷，
# 看起来就像数据全丢了（dev 那份顶部一直有 name:，这里补齐同一口径）。
name: homeledger-prod

# 2C2G 机型统一日志上限：nginx/app 的 stdout 走 docker json-file，不限会无限增长打满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql8:
    image: mysql:8.4
    container_name: homeledger-mysql8
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=134217728      # 2C2G 机型：buffer pool 收敛到 128M，默认会抢内存
      - --performance-schema=OFF                 # 省 ~300M 常驻内存
      - --max-connections=100                    # 家庭级应用 100 连接绰绰有余
    mem_limit: 768m
    ports:
      # 只绑宿主机回环口，供排查用；应用走内部网络不经过这里
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql8-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    # 镜像由 README 第 3 步构建：backend/Dockerfile（eclipse-temurin:25-jre-alpine）+ 本地打出的 jar
    image: homeledger-backend:1.0.0
    container_name: homeledger-app
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql8:
        condition: service_healthy
    healthcheck:
      # 说明：unhealthy 只让状态可见于 docker ps / 监控，普通 docker compose **不会**因此重启容器
      # （restart 只管容器退出；JVM 假死要自动拉起需另配 autoheal 看门狗）。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    extra_hosts:
      # 宿主机上已有 redis → 容器内经这个别名访问宿主 redis（Linux 需要这条映射）
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: mysql8
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 若你的 redis 也在 docker 里且不在宿主网段，改成它的容器名并把它接入本网络
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-never}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      HOMELEDGER_UPLOAD_DIR: /data/uploads
      HOMELEDGER_UPLOAD_USE_NGINX_ACCEL: "true"
      TZ: Asia/Shanghai
    # 2C2G 机型：把容器内存钉在 1024m。Java 25 的 MaxRAMPercentage=75 会自动按 cgroup 上限算，
    # 堆上限约 768m，正好压在 1G 内；不设上限的话 JVM 按宿主机 2G 申请 1.5G 堆，必然 OOM。
    mem_limit: 1024m
    ports:
      # 只回环暴露给宿主机 nginx 反代，不直接对外
      - "127.0.0.1:8080:8080"
    volumes:
      # 与宿主机 nginx 的 /photos/ internal alias 同一目录（部署在 /opt/homeledger/uploads）
      - /opt/homeledger/uploads:/data/uploads

volumes:
  mysql8-data: