worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile      on;
    server_tokens off;

    # API 的 JSON 响应（账单列表/统计）与文本走 gzip；照片（png/jpg/webp）本身已压缩，
    # 不进 gzip_types，白费 CPU（扫描报告 2026-10-26 P2-9）
    gzip              on;
    gzip_types        application/json text/css application/javascript;
    gzip_min_length   1024;
    gzip_comp_level   5;

    # 档案照片上传（需求 §4.2 / §4.3 / §4.4）；客户端已压缩，此处给足余量
    client_max_body_size 10m;

    upstream homeledger_app {
        server app:8080;
    }

    server {
        listen 80;
        server_name _;

        # S10 决策：HTTPS / HSTS 本轮不做，保持纯 HTTP（第 29 轮登记的具体理由见需求文档附录）。
        # 对外边界（§5.2「全站 HTTPS」）仍是待办，未来接证书时本段改为 80→443 跳转。

        location / {
            proxy_pass         http://homeledger_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 档案照片直出（§4.3.1）：后端鉴权通过后回 X-Accel-Redirect: /photos/...，
        # 本 internal 位置从共享卷取文件替换响应体。internal = 外部直接 GET /photos/... 一律 404，
        # 配合后端反查归属，照片不会变成公开静态文件。alias 必须带尾斜杠与卷内文件名一一对应。
        # 缓存头由后端随响应发出（Cache-Control: max-age=365d, public, immutable，X-Accel 透传），
        # 这里不再 add_header——追加而非覆盖会出现两条语义冲突的 Cache-Control（复扫 2026-10-26 P2）。
        location /photos/ {
            internal;
            alias /data/uploads/;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
